<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>会員登録 (A-002) - オンラインチケット予約</title>
    <style>
        /* 基本的なスタイル */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans CJK JP", "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f7f9;
            color: #333;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        header {
            background-color: #2c3e50;
            color: white;
            padding: 20px 0;
            text-align: center;
            width: 100%;
        }
        header h1 {
            margin: 0;
            font-size: 1.8em;
        }
        footer {
            background-color: #34495e;
            color: white;
            text-align: center;
            padding: 15px 0;
            width: 100%;
        }
        
        /* フォームのスタイル */
        .form-container {
            background-color: white;
            padding: 30px 40px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        .form-container h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #2c3e50;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box; /* paddingを含めてwidthを100%に保つ */
        }
        .submit-btn {
            width: 100%;
            padding: 15px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .submit-btn:hover {
            background-color: #2980b9;
        }
        .login-link {
            text-align: center;
            margin-top: 20px;
        }
        .login-link a {
            color: #3498db;
            text-decoration: none;
        }

        /* パスワード強度表示のスタイル */
        .password-strength {
            margin-top: 8px;
            font-size: 0.9em;
            height: 20px;
        }
        .strength-weak { color: #e74c3c; }
        .strength-medium { color: #f39c12; }
        .strength-strong { color: #2ecc71; }
    </style>
</head>
<body>

    <header>
        <h1>オンラインチケット予約システム</h1>
    </header>

    <main class="container">
        <div class="form-container">
            <h2>会員登録</h2>
            <form action="/auth/registered" method="post">
                <div class="form-group">
                    <label for="email">メールアドレス</label>
                    <input type="email" id="email" name="email" required>
                </div>
                
                <div class="form-group">
                    <label for="password">パスワード</label>
                    <input type="password" id="password" name="password" required>
                    <div id="password-strength-indicator" class="password-strength"></div>
                </div>

                <button type="submit" class="submit-btn">登録する</button>
            </form>
            <div class="login-link">
                <p>すでにアカウントをお持ちですか？ <a href="/auth/login">ログイン</a></p>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2025 オンラインチケット予約システム</p>
    </footer>

    <script>
        // パスワード強度をチェックして表示を更新するスクリプト
        const passwordInput = document.getElementById('password');
        const strengthIndicator = document.getElementById('password-strength-indicator');

        passwordInput.addEventListener('input', () => {
            const password = passwordInput.value;
            let strengthText = '';
            let strengthClass = '';

            if (password.length === 0) {
                // Do nothing
            } else if (password.length < 6) {
                strengthText = '弱い';
                strengthClass = 'strength-weak';
            } else if (password.length < 10) {
                strengthText = '普通';
                strengthClass = 'strength-medium';
            } else {
                strengthText = '強い';
                strengthClass = 'strength-strong';
            }

            strengthIndicator.textContent = strengthText;
            strengthIndicator.className = 'password-strength ' + strengthClass;
        });
    </script>

</body>
</html>
