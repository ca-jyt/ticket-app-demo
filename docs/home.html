<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ホーム画面 (A-006) - オンラインチケット予約</title>
    <style>
        /* 基本的なスタイルとレスポンシブ対応 */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans CJK JP", "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f7f9;
            color: #333;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }
        header {
            background-color: #2c3e50;
            color: white;
            padding: 20px 0;
            text-align: center;
            width: 100%;
        }
        header h1 {
            margin: 0;
            font-size: 1.8em;
        }
        footer {
            background-color: #34495e;
            color: white;
            text-align: center;
            padding: 15px 0;
            width: 100%;
        }
        /* ナビゲーションのスタイル */
        .main-nav ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 20px; /* ボタン間の余白 */
        }
        .main-nav a {
            display: block;
            background-color: #3498db;
            color: white;
            padding: 15px 30px;
            text-decoration: none;
            border-radius: 8px;
            font-size: 1.2em;
            font-weight: bold;
            transition: background-color 0.3s, transform 0.2s;
            min-width: 250px;
        }
        .main-nav a:hover {
            background-color: #2980b9;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <header>
        <h1>オンラインチケット予約システム</h1>
    </header>

    <main class="container">
        <div>
            <h2>ようこそ</h2>
            <p>ご希望の操作を選択してください。</p>

            <nav class="main-nav">
                <ul>
                    <li><a href="/movies">映画一覧を見る</a></li>
                    
                    <li><a href="/auth/register">会員登録</a></li>

                    <li><a href="/auth/login">ログイン</a></li>
                    
                    <li><a href="/me/reservations">予約履歴の確認</a></li>
                </ul>
            </nav>
        </div>
    </main>

    <footer>
        <p>&copy; 2025 オンラインチケット予約システム</p>
    </footer>

</body>
</html>
